<svg xmlns="http://www.w3.org/2000/svg" width="600" height="454" viewBox="0 0 600 454" role="img" aria-labelledby="title">
  <title id="title">Meltdown 例题中的故障记录、数据转发与退休</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#252525"/>
    </marker>
  </defs>
  <rect width="600" height="454" fill="#fff"/>
  <g fill="#f4f4f4" stroke="#252525" stroke-width="1.5">
    <rect x="24" y="20" width="552" height="102" rx="3"/>
    <rect x="24" y="180" width="263" height="113" rx="3"/>
    <rect x="313" y="180" width="263" height="113" rx="3"/>
    <rect x="24" y="354" width="263" height="80" rx="3"/>
    <rect x="313" y="354" width="263" height="80" rx="3"/>
  </g>
  <g fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M155 122 V178"/>
    <path d="M444 122 V178" stroke-dasharray="4 4"/>
    <path d="M155 293 V352"/>
    <path d="M155 327 H444 V352"/>
  </g>
  <g fill="#191919" font-family="'Microsoft YaHei UI', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">
    <g font-size="22" font-weight="700">
      <text x="300" y="52">加载单元与地址翻译</text>
      <text x="155" y="211">重排序缓冲（ROB）</text>
      <text x="444" y="211">依赖指令</text>
      <text x="155" y="385">交付页错误</text>
      <text x="444" y="385">丢弃内部结果</text>
    </g>
    <g font-size="19">
      <text x="300" y="79">mov eax, [rdi]</text>
      <text x="300" y="103">页存在，用户读权限被拒绝</text>
      <text x="155" y="241">记录 #PF，低三位 101</text>
      <text x="155" y="267">故障项等待退休</text>
      <text x="444" y="241">add eax, 1</text>
      <text x="444" y="267">输入 41，临时得到 42</text>
      <text x="155" y="413">eax = 7，ecx = 8</text>
      <text x="444" y="413">42 未写入架构状态</text>
    </g>
    <g font-size="17">
      <text x="107" y="155">故障记录</text>
      <text x="364" y="155">内部转发（题设）</text>
      <text x="300" y="317">故障项轮到退休</text>
    </g>
  </g>
</svg>
