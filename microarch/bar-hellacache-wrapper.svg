<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 746" role="img" aria-labelledby="title desc">
  <title id="title">BAR-fetchers 与 Rocket L1 数据缓存的连接</title>
  <desc id="desc">核心请求沿左线送往仲裁，也分出一条观察线，经两拍对齐训练步长器。候选进入一项队列，再与核心请求仲裁。s2 控制根据缓存反馈处理取消和队列释放。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="420" height="746" fill="white"/>
  <g stroke="#171717" stroke-width="1.5" fill="#f4f4f4">
    <rect x="63" y="20" width="294" height="55" rx="3"/>
    <rect x="16" y="132" width="388" height="461" rx="4" fill="white"/>
    <rect x="173" y="175" width="199" height="62" rx="3"/>
    <rect x="173" y="275" width="199" height="60" rx="3"/>
    <rect x="173" y="374" width="199" height="60" rx="3"/>
    <rect x="45" y="501" width="196" height="61" rx="3"/>
    <rect x="264" y="501" width="119" height="61" rx="3"/>
    <rect x="63" y="670" width="294" height="55" rx="3"/>
  </g>
  <g fill="none" stroke="#171717" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M93 75v426"/>
    <path d="M93 105h179v70"/>
    <path d="M272 237v38"/>
    <path d="M272 335v39"/>
    <path d="M228 434v25h-58v42"/>
    <path d="M143 562v108"/>
  </g>
  <circle cx="93" cy="105" r="3" fill="#171717"/>
  <g fill="none" stroke="#171717" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <path d="M319 670V562"/>
    <path d="M353 562v108"/>
    <path d="M326 501v-67"/>
    <path d="M264 535h-23"/>
  </g>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#171717" text-anchor="middle">
    <g font-size="18" font-weight="600">
      <text x="210" y="54">Rocket 核心</text>
      <text x="272" y="199">观察筛选</text>
      <text x="272" y="299">步长器</text>
      <text x="272" y="398">一项队列</text>
      <text x="143" y="525">缓存入口仲裁</text>
      <text x="323" y="525">s2 控制</text>
      <text x="210" y="704">L1 数据缓存</text>
    </g>
    <g font-size="14">
      <text x="179" y="98" font-family="monospace">io.cpu.req</text>
      <text x="158" y="153" text-anchor="end">包装器</text>
      <text x="272" y="222">入口握手延迟两拍</text>
      <text x="283" y="260" text-anchor="start" font-family="monospace">snoop</text>
      <text x="272" y="322">历史、步长和候选寄存器</text>
      <text x="283" y="358" text-anchor="start" font-family="monospace">request</text>
      <text x="272" y="421" font-family="monospace">0x1288</text>
      <text x="143" y="548">核心优先</text>
      <text x="323" y="548" font-family="monospace">in_flight</text>
      <text x="58" y="259">需求</text>
      <text x="167" y="449">候选</text>
      <text x="337" y="475" text-anchor="start">释放</text>
      <text x="129" y="620" text-anchor="end">地址和命令</text>
      <text x="155" y="644" text-anchor="start" font-family="monospace">0x1280</text>
      <text x="308" y="613" text-anchor="end" font-family="monospace">s2_paddr</text>
      <text x="308" y="634" text-anchor="end" font-family="monospace">s2_nack</text>
      <text x="360" y="625" text-anchor="start" font-family="monospace" font-size="12">s2_kill</text>
    </g>
  </g>
</svg>
